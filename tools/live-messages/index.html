<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Share a message</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f1ea;
      --bg-card: #ffffff;
      --ink: #1a1714;
      --ink-soft: #6b645c;
      --accent: #c8472d;
      --accent-soft: #f4e3dd;
      --border: #e6dfd4;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(26, 23, 20, 0.04), 0 8px 24px rgba(26, 23, 20, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 24px 20px 40px;
      background-image: radial-gradient(circle at 10% 0%, rgba(200, 71, 45, 0.06), transparent 40%),
                        radial-gradient(circle at 90% 100%, rgba(200, 71, 45, 0.04), transparent 50%);
    }
    main {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .header { margin-bottom: 28px; }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .event-badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-left: 6px;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 800;
      font-size: clamp(34px, 9vw, 44px);
      line-height: 1.02;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    .subtitle {
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.5;
      margin: 0;
    }
    form {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    input, textarea {
      font-family: inherit;
      font-size: 16px;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--border);
      padding: 8px 0;
      outline: none;
      transition: border-color 0.15s ease;
      resize: none;
    }
    input:focus, textarea:focus { border-bottom-color: var(--accent); }
    input::placeholder, textarea::placeholder { color: #b8b0a4; }
    textarea {
      min-height: 600px;
      line-height: 1.55;
      font-size: 16px;
      padding: 14px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      resize: vertical;
    }
    textarea:focus { border-color: var(--accent); }
    .char-count {
      font-size: 11px;
      color: var(--ink-soft);
      text-align: right;
      margin-top: -4px;
    }
    button {
      font-family: inherit;
      background: var(--ink);
      color: var(--bg);
      border: none;
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      margin-top: 6px;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    button:hover { background: var(--accent); }
    button:active { transform: scale(0.98); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .success {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 36px 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .check {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }
    .success h2 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 26px;
      margin: 0 0 8px;
    }
    .success p { color: var(--ink-soft); margin: 0 0 22px; font-size: 14px; }
    .secondary-btn {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--ink);
      padding: 12px 22px;
      width: auto;
    }
    .secondary-btn:hover { background: var(--ink); color: var(--bg); }
    .error {
      color: var(--accent);
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
      min-height: 18px;
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--ink-soft);
      margin-top: 32px;
      letter-spacing: 0.06em;
    }
    .no-event {
      text-align: center;
      padding: 40px 20px;
    }
    .no-event h2 {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      margin-bottom: 8px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main id="app">
    <!-- rendered by JS -->
  </main>
  <div class="footer">LIVE AUDIENCE MESSAGES</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("event");
    const appEl = document.getElementById("app");

    if (!eventId) {
      appEl.innerHTML = `
        <div class="no-event">
          <h2>No event linked</h2>
          <p style="color: var(--ink-soft);">Please scan the QR code from the presenter to join.</p>
        </div>`;
    } else {
      renderForm();
    }

    function renderForm() {
      appEl.innerHTML = `
        <div class="header">
          <div class="eyebrow">Audience PROMPT <span class="event-badge">${escapeHtml(eventId)}</span></div>
          <h1>Share your <em>prompt</em></h1>
          <p class="subtitle">Your Prompt will appear on the presenter's screen live.</p>
        </div>
        <form id="messageForm" autocomplete="off">
          <div class="field">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" placeholder="e.g. John" maxlength="40" required />
          </div>
          <div class="field">
            <label for="message">PROMPT</label>
            <textarea id="message" name="message" placeholder="Type your Prompt..." maxlength="3000" required></textarea>
            <div class="char-count"><span id="count">0</span>/3000</div>
          </div>
          <button type="submit" id="submitBtn">Submit</button>
          <div class="error" id="error"></div>
        </form>`;

      const form = document.getElementById("messageForm");
      const msg = document.getElementById("message");
      const count = document.getElementById("count");
      const btn = document.getElementById("submitBtn");
      const err = document.getElementById("error");

      msg.addEventListener("input", () => { count.textContent = msg.value.length; });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.textContent = "";
        btn.disabled = true;
        btn.textContent = "Sending...";

        const name = document.getElementById("name").value.trim();
        const message = msg.value.trim();
        if (!name || !message) {
          err.textContent = "Please fill in both fields.";
          btn.disabled = false;
          btn.textContent = "Send to presenter";
          return;
        }

        try {
          const listRef = ref(db, `events/${eventId}/messages`);
          await push(listRef, { name, message, ts: serverTimestamp() });
          renderSuccess();
        } catch (e) {
          console.error(e);
          err.textContent = "Couldn't send. Check your connection and try again.";
          btn.disabled = false;
          btn.textContent = "Send to presenter";
        }
      });
    }

    function renderSuccess() {
      appEl.innerHTML = `
        <div class="success">
          <div class="check">✓</div>
          <h2>Message sent</h2>
          <p>Thanks — your message is now live on screen.</p>
          <button class="secondary-btn" id="again">Send another</button>
        </div>`;
      document.getElementById("again").addEventListener("click", renderForm);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }
  </script>
</body>
</html>

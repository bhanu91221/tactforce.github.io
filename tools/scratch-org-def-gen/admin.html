<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scratch Org Generator — Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: {
          gray: { 800: '#1f2937', 900: '#111827', 950: '#0B0F19' },
          primary: { 400: '#60A5FA', 500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8' },
          danger: { 500: '#EF4444', 600: '#DC2626' },
          success: { 500: '#10B981', 600: '#059669' }
        } } }
      }
    </script>
    <style>
      body { background-color: #0B0F19; color: #e5e7eb; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #1f2937; }
      ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.18s ease-out forwards; }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="./data/categories.js"></script>
    <script src="./data/features.js"></script>
    <script src="./data/settings.js"></script>
    <script src="./data/baseline.js"></script>
</head>
<body>
    <div id="root" class="min-h-screen"></div>

    <script type="text/babel" data-presets="env,react">
        const { useState, useMemo, useEffect } = React;

        const CATEGORIES = window.CATEGORIES || [];
        const SETTINGS_FULL = window.SETTINGS || [];
        const SETTINGS_BY_ID = SETTINGS_FULL.reduce((a, s) => { a[s.id] = s; return a; }, {});

        const LS_FEATURES = 'SCRATCH_GEN_FEATURES_V2';
        const LS_SETTINGS = 'SCRATCH_GEN_SETTINGS_V2';
        const LS_BASELINE = 'SCRATCH_GEN_BASELINE_V2';

        function loadFeatures() {
            try { const s = localStorage.getItem(LS_FEATURES); if (s) return JSON.parse(s); } catch {}
            return JSON.parse(JSON.stringify(window.FEATURES || []));
        }
        function loadSettings() {
            try { const s = localStorage.getItem(LS_SETTINGS); if (s) return JSON.parse(s); } catch {}
            return JSON.parse(JSON.stringify(window.SETTINGS || []));
        }
        function loadBaseline() {
            try { const s = localStorage.getItem(LS_BASELINE); if (s) return JSON.parse(s); } catch {}
            return JSON.parse(JSON.stringify(window.BASELINE || { featureIds: [], settings: {} }));
        }

        function emitJsFile(varName, data, header) {
            return `// AUTO-GENERATED. Edit via admin.html.\n// ${header}\nwindow.${varName} = ${JSON.stringify(data, null, 2)};\n`;
        }
        function downloadText(filename, text) {
            const blob = new Blob([text], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Icons
        const PlusIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>);
        const TrashIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>);
        const DownloadIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>);
        const CheckIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>);
        const ChevronDownIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 9 6 6 6-6"/></svg>);
        const ChevronRightIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg>);
        const SearchIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>);

        function Field({ label, children, hint }) {
            return (
                <div>
                    <label className="block text-xs font-semibold text-gray-400 mb-1">{label}</label>
                    {children}
                    {hint && <p className="text-[10px] text-gray-600 mt-1">{hint}</p>}
                </div>
            );
        }

        // =============================================================
        // FEATURES EDITOR
        // =============================================================
        function FeaturesEditor({ features, setFeatures, toast }) {
            const [search, setSearch] = useState('');
            const [selectedId, setSelectedId] = useState(null);
            const [expanded, setExpanded] = useState({});

            const filtered = useMemo(() => {
                if (!search.trim()) return features;
                const q = search.toLowerCase();
                return features.filter(f =>
                    f.label.toLowerCase().includes(q) ||
                    f.featureName.toLowerCase().includes(q) ||
                    (f.description || '').toLowerCase().includes(q)
                );
            }, [features, search]);

            const byCategory = useMemo(() => {
                const out = {};
                for (const f of filtered) (out[f.category] = out[f.category] || []).push(f);
                return out;
            }, [filtered]);

            const selected = features.find(f => f.id === selectedId);
            const update = (id, patch) => setFeatures(features.map(f => f.id === id ? { ...f, ...patch } : f));
            const remove = (id) => { if (!confirm('Delete this feature?')) return; setFeatures(features.filter(f => f.id !== id)); if (selectedId === id) setSelectedId(null); };
            const addNew = () => {
                const id = `custom-${Date.now()}`;
                const nf = { id, featureName: 'NewFeature', label: 'New Feature', description: '', category: 'core-platform', settings: [] };
                setFeatures([nf, ...features]);
                setSelectedId(id);
                setExpanded(e => ({ ...e, 'core-platform': true }));
            };

            const save = () => { localStorage.setItem(LS_FEATURES, JSON.stringify(features)); toast('Saved to browser storage'); };
            const download = () => { downloadText('features.js', emitJsFile('FEATURES', features, `${features.length} scratch-org features with embedded settings.`)); toast('Downloaded features.js — replace data/features.js and commit'); };
            const revert = () => {
                if (!confirm('Discard all local edits and revert to the baked-in defaults?')) return;
                localStorage.removeItem(LS_FEATURES);
                setFeatures(JSON.parse(JSON.stringify(window.FEATURES || [])));
                setSelectedId(null);
                toast('Reverted to defaults');
            };

            return (
                <div className="flex h-full">
                    <div className="w-1/3 border-r border-gray-800 flex flex-col">
                        <div className="p-3 border-b border-gray-800 flex gap-2 items-center">
                            <div className="relative flex-1">
                                <div className="absolute inset-y-0 left-0 pl-2 flex items-center pointer-events-none"><SearchIcon /></div>
                                <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search features..."
                                    className="bg-gray-900 border border-gray-800 rounded pl-7 pr-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600" />
                            </div>
                            <button onClick={addNew} className="flex items-center gap-1 px-2 py-1.5 bg-primary-600 hover:bg-primary-700 rounded text-xs text-white"><PlusIcon/> New</button>
                        </div>
                        <div className="flex-1 overflow-y-auto">
                            {CATEGORIES.map(cat => {
                                const items = byCategory[cat.id] || [];
                                if (!items.length) return null;
                                const isOpen = expanded[cat.id] ?? (search.trim().length > 0);
                                return (
                                    <div key={cat.id}>
                                        <button onClick={() => setExpanded(e => ({ ...e, [cat.id]: !isOpen }))}
                                            className="w-full flex items-center justify-between px-3 py-2 text-left hover:bg-gray-900 text-sm">
                                            <span className="flex items-center gap-2">
                                                {isOpen ? <ChevronDownIcon/> : <ChevronRightIcon/>}
                                                <span className="text-gray-300 font-medium">{cat.label}</span>
                                            </span>
                                            <span className="text-[10px] text-gray-500">{items.length}</span>
                                        </button>
                                        {isOpen && items.map(f => (
                                            <button key={f.id} onClick={() => setSelectedId(f.id)}
                                                className={`w-full text-left px-5 py-1.5 text-xs truncate hover:bg-gray-900 flex items-center justify-between ${selectedId === f.id ? 'bg-primary-600/20 text-primary-400' : 'text-gray-400'}`}>
                                                <span className="truncate">{f.label}</span>
                                                {f.settings && f.settings.length > 0 && (
                                                    <span className="flex-none ml-2 text-[9px] text-gray-500">{f.settings.length}s</span>
                                                )}
                                            </button>
                                        ))}
                                    </div>
                                );
                            })}
                        </div>
                        <div className="p-3 border-t border-gray-800 flex flex-col gap-2">
                            <div className="flex gap-2">
                                <button onClick={save} className="flex-1 flex items-center justify-center gap-1 px-2 py-1.5 bg-success-600 hover:bg-success-500 rounded text-xs text-white"><CheckIcon/> Save (browser)</button>
                                <button onClick={download} className="flex-1 flex items-center justify-center gap-1 px-2 py-1.5 bg-primary-600 hover:bg-primary-700 rounded text-xs text-white"><DownloadIcon/> Download</button>
                            </div>
                            <button onClick={revert} className="w-full text-xs text-gray-500 hover:text-red-400">Revert to defaults</button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto">
                        {selected
                            ? <FeatureDetail key={selected.id} feature={selected} update={update} remove={remove} />
                            : <div className="h-full flex items-center justify-center text-gray-500 italic">
                                Select a feature from the left — or click <span className="text-primary-400 mx-1">+ New</span>.
                            </div>}
                    </div>
                </div>
            );
        }

        function FeatureDetail({ feature, update, remove }) {
            const [hasValue, setHasValue] = useState(!!feature.valueRange);
            const vr = feature.valueRange || { min: 1, max: 30, default: 1 };

            const addSettingGroup = (typeName) => {
                if (!typeName) return;
                const settings = [...(feature.settings || [])];
                if (settings.some(sg => sg.typeName === typeName)) return;
                settings.push({ typeName, required: false, fields: [] });
                update(feature.id, { settings });
            };
            const removeSettingGroup = (typeName) => {
                if (!confirm(`Remove ${typeName} from this feature?`)) return;
                const settings = (feature.settings || []).filter(sg => sg.typeName !== typeName);
                update(feature.id, { settings });
            };
            const updateSettingGroup = (typeName, patch) => {
                const settings = (feature.settings || []).map(sg => sg.typeName === typeName ? { ...sg, ...patch } : sg);
                update(feature.id, { settings });
            };
            const addFieldToGroup = (typeName, fieldName) => {
                if (!fieldName) return;
                const groups = feature.settings || [];
                const g = groups.find(sg => sg.typeName === typeName);
                if (!g) return;
                if (g.fields.some(f => f.name === fieldName)) return;
                const catalog = SETTINGS_BY_ID[typeName];
                const catalogField = catalog?.fields.find(f => f.name === fieldName);
                const type = catalogField?.type || 'boolean';
                const newField = {
                    name: fieldName, type, smartDefault: true,
                    defaultValue: catalogField?.defaultValue ?? (type === 'boolean' ? true : type === 'number' ? 0 : ''),
                };
                if (catalogField?.description) newField.description = catalogField.description;
                updateSettingGroup(typeName, { fields: [...g.fields, newField] });
            };
            const removeFieldFromGroup = (typeName, fieldName) => {
                const g = (feature.settings || []).find(sg => sg.typeName === typeName);
                if (!g) return;
                updateSettingGroup(typeName, { fields: g.fields.filter(f => f.name !== fieldName) });
            };
            const updateField = (typeName, fieldName, patch) => {
                const g = (feature.settings || []).find(sg => sg.typeName === typeName);
                if (!g) return;
                updateSettingGroup(typeName, { fields: g.fields.map(f => f.name === fieldName ? { ...f, ...patch } : f) });
            };

            return (
                <div className="p-6 animate-fade-in max-w-3xl">
                    <div className="flex justify-between items-start mb-4">
                        <div>
                            <h3 className="text-lg font-bold text-white">Edit Feature</h3>
                            <p className="text-xs text-gray-500 mt-0.5">Internal id: <code>{feature.id}</code></p>
                        </div>
                        <button onClick={() => remove(feature.id)} className="flex items-center gap-1 px-2 py-1 bg-danger-600/20 hover:bg-danger-600/40 text-danger-500 rounded text-xs"><TrashIcon/> Delete</button>
                    </div>

                    <div className="space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                            <Field label="Label">
                                <input type="text" value={feature.label} onChange={(e) => update(feature.id, { label: e.target.value })}
                                    className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600" />
                            </Field>
                            <Field label="Feature Name (exact Salesforce string)">
                                <input type="text" value={feature.featureName} onChange={(e) => update(feature.id, { featureName: e.target.value })}
                                    className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm font-mono text-white focus:outline-none focus:border-primary-600" />
                            </Field>
                        </div>

                        <Field label="Category">
                            <select value={feature.category} onChange={(e) => update(feature.id, { category: e.target.value })}
                                className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600">
                                {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                            </select>
                        </Field>

                        <Field label="Description">
                            <textarea value={feature.description || ''} onChange={(e) => update(feature.id, { description: e.target.value })}
                                rows={3}
                                className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600" />
                        </Field>

                        <Field label="Docs URL (optional)">
                            <input type="text" value={feature.docUrl || ''} onChange={(e) => update(feature.id, { docUrl: e.target.value || undefined })}
                                className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600" />
                        </Field>

                        <div>
                            <label className="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
                                <input type="checkbox" checked={hasValue} onChange={(e) => {
                                    setHasValue(e.target.checked);
                                    if (e.target.checked) update(feature.id, { valueRange: { ...vr } });
                                    else update(feature.id, { valueRange: undefined });
                                }} />
                                Takes a <code className="bg-gray-900 px-1 rounded text-xs">:&lt;value&gt;</code> numeric parameter
                            </label>
                            {hasValue && (
                                <div className="grid grid-cols-3 gap-2 mt-2">
                                    <Field label="Min">
                                        <input type="number" value={vr.min} onChange={(e) => update(feature.id, { valueRange: { ...vr, min: Number(e.target.value) } })}
                                            className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600" />
                                    </Field>
                                    <Field label="Max">
                                        <input type="number" value={vr.max} onChange={(e) => update(feature.id, { valueRange: { ...vr, max: Number(e.target.value) } })}
                                            className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600" />
                                    </Field>
                                    <Field label="Default">
                                        <input type="number" value={vr.default} onChange={(e) => update(feature.id, { valueRange: { ...vr, default: Number(e.target.value) } })}
                                            className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600" />
                                    </Field>
                                </div>
                            )}
                        </div>

                        <Field label="Requires (other featureNames, comma-separated)" hint="Checking this feature will auto-check these.">
                            <input type="text" value={(feature.requires || []).join(', ')}
                                onChange={(e) => {
                                    const arr = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
                                    update(feature.id, { requires: arr.length ? arr : undefined });
                                }}
                                className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm font-mono text-white focus:outline-none focus:border-primary-600" />
                        </Field>

                        <div>
                            <label className="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
                                <input type="checkbox" checked={!!feature.deprecated}
                                    onChange={(e) => update(feature.id, { deprecated: e.target.checked || undefined })} />
                                Mark as deprecated
                            </label>
                        </div>

                        {/* ==== Attached settings ==== */}
                        <div className="pt-5 mt-5 border-t border-gray-800">
                            <div className="flex items-center justify-between mb-2">
                                <h4 className="text-sm font-bold text-white">Attached Settings</h4>
                                <AddSettingGroupPicker existing={(feature.settings || []).map(s => s.typeName)} onAdd={addSettingGroup} />
                            </div>
                            <p className="text-[11px] text-gray-500 mb-3">
                                Setting groups listed here are auto-included when the user selects this feature. Fields with "Smart default" are pre-checked.
                            </p>
                            {(feature.settings || []).length === 0
                                ? <div className="text-xs text-gray-500 italic py-4">No settings attached. Add one from the picker above.</div>
                                : (feature.settings || []).map(sg => (
                                    <SettingGroupEditor key={sg.typeName} group={sg}
                                        onRemoveGroup={() => removeSettingGroup(sg.typeName)}
                                        onUpdateGroup={(patch) => updateSettingGroup(sg.typeName, patch)}
                                        onAddField={(fn) => addFieldToGroup(sg.typeName, fn)}
                                        onRemoveField={(fn) => removeFieldFromGroup(sg.typeName, fn)}
                                        onUpdateField={(fn, patch) => updateField(sg.typeName, fn, patch)} />
                                ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AddSettingGroupPicker({ existing, onAdd }) {
            const [open, setOpen] = useState(false);
            const [q, setQ] = useState('');
            const choices = useMemo(() => {
                const excl = new Set(existing);
                const ql = q.toLowerCase();
                return SETTINGS_FULL
                    .filter(s => !excl.has(s.settingTypeName))
                    .filter(s => !ql || s.settingTypeName.toLowerCase().includes(ql) || s.label.toLowerCase().includes(ql))
                    .slice(0, 30);
            }, [existing, q]);
            return (
                <div className="relative">
                    <button onClick={() => setOpen(o => !o)} className="flex items-center gap-1 text-xs px-2 py-1 bg-primary-600 hover:bg-primary-700 rounded text-white"><PlusIcon/> Add setting group</button>
                    {open && (
                        <div className="absolute right-0 mt-1 w-80 bg-gray-900 border border-gray-800 rounded-lg shadow-xl z-20">
                            <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Type to filter..."
                                className="bg-gray-950 border-b border-gray-800 px-3 py-2 w-full text-xs text-white focus:outline-none" />
                            <div className="max-h-72 overflow-y-auto">
                                {choices.map(s => (
                                    <button key={s.settingTypeName}
                                        onClick={() => { onAdd(s.settingTypeName); setOpen(false); setQ(''); }}
                                        className="block w-full text-left px-3 py-1.5 hover:bg-gray-800 text-xs">
                                        <div className="font-mono text-primary-400">{s.settingTypeName}</div>
                                        <div className="text-[10px] text-gray-500 truncate">{s.label} · {s.fields.length} fields</div>
                                    </button>
                                ))}
                                {choices.length === 0 && <div className="px-3 py-2 text-xs text-gray-500 italic">No matches</div>}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SettingGroupEditor({ group, onRemoveGroup, onUpdateGroup, onAddField, onRemoveField, onUpdateField }) {
            const [collapsed, setCollapsed] = useState(false);
            const catalog = SETTINGS_BY_ID[group.typeName];
            const availableFields = useMemo(() => {
                if (!catalog) return [];
                const existing = new Set(group.fields.map(f => f.name));
                return catalog.fields.filter(f => !existing.has(f.name));
            }, [catalog, group.fields]);

            return (
                <div className="bg-gray-900/60 rounded-lg border border-gray-800 mb-3">
                    <div className="flex items-center justify-between px-3 py-2 border-b border-gray-800">
                        <button onClick={() => setCollapsed(c => !c)} className="flex items-center gap-2 flex-1 text-left">
                            {collapsed ? <ChevronRightIcon/> : <ChevronDownIcon/>}
                            <code className="text-xs text-primary-400 font-mono">{group.typeName}</code>
                            <span className="text-[10px] text-gray-500">{group.fields.length} field{group.fields.length === 1 ? '' : 's'}</span>
                        </button>
                        <label className="flex items-center gap-1.5 text-[11px] text-gray-400 cursor-pointer mr-3">
                            <input type="checkbox" checked={!!group.required} onChange={(e) => onUpdateGroup({ required: e.target.checked })} />
                            Required
                        </label>
                        <button onClick={onRemoveGroup} className="text-danger-500 hover:text-danger-600"><TrashIcon/></button>
                    </div>
                    {!collapsed && (
                        <div className="p-3">
                            {group.fields.length === 0
                                ? <div className="text-xs text-gray-500 italic">No fields yet.</div>
                                : group.fields.map(f => (
                                    <div key={f.name} className="flex items-center gap-2 py-1 px-2 rounded hover:bg-gray-900">
                                        <code className="text-xs text-gray-200 flex-1 font-mono">{f.name}</code>
                                        <select value={f.type} onChange={(e) => onUpdateField(f.name, { type: e.target.value })}
                                            className="bg-gray-950 border border-gray-800 rounded px-1 py-0.5 text-[11px] text-gray-400">
                                            <option value="boolean">boolean</option>
                                            <option value="string">string</option>
                                            <option value="number">number</option>
                                        </select>
                                        <label className="flex items-center gap-1 text-[11px] text-gray-400 cursor-pointer">
                                            <input type="checkbox" checked={!!f.smartDefault} onChange={(e) => onUpdateField(f.name, { smartDefault: e.target.checked || undefined })} />
                                            Smart
                                        </label>
                                        <label className="flex items-center gap-1 text-[11px] text-gray-400 cursor-pointer">
                                            <input type="checkbox" checked={!!f.required} onChange={(e) => onUpdateField(f.name, { required: e.target.checked || undefined })} />
                                            Req
                                        </label>
                                        <button onClick={() => onRemoveField(f.name)} className="text-danger-500 hover:text-danger-600"><TrashIcon/></button>
                                    </div>
                                ))}
                            {availableFields.length > 0 && (
                                <AddFieldPicker available={availableFields} onAdd={onAddField} />
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function AddFieldPicker({ available, onAdd }) {
            const [open, setOpen] = useState(false);
            const [q, setQ] = useState('');
            const choices = useMemo(() => {
                const ql = q.toLowerCase();
                return (available || []).filter(f => !ql || f.name.toLowerCase().includes(ql)).slice(0, 30);
            }, [available, q]);
            return (
                <div className="relative mt-2">
                    <button onClick={() => setOpen(o => !o)} className="flex items-center gap-1 text-[11px] px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-300"><PlusIcon/> Add field ({available.length} available)</button>
                    {open && (
                        <div className="absolute left-0 mt-1 w-80 bg-gray-900 border border-gray-800 rounded-lg shadow-xl z-20">
                            <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filter..."
                                className="bg-gray-950 border-b border-gray-800 px-3 py-2 w-full text-xs text-white focus:outline-none" />
                            <div className="max-h-60 overflow-y-auto">
                                {choices.map(f => (
                                    <button key={f.name} onClick={() => { onAdd(f.name); setOpen(false); setQ(''); }}
                                        className="block w-full text-left px-3 py-1.5 hover:bg-gray-800 text-xs">
                                        <div className="font-mono text-gray-200">{f.name} <span className="text-[9px] text-gray-500">{f.type}</span></div>
                                        {f.description && <div className="text-[10px] text-gray-500 truncate">{f.description}</div>}
                                    </button>
                                ))}
                                {choices.length === 0 && <div className="px-3 py-2 text-xs text-gray-500 italic">No matches</div>}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // =============================================================
        // SETTINGS EDITOR (catalog)
        // =============================================================
        function SettingsEditor({ settings, setSettings, toast }) {
            const [search, setSearch] = useState('');
            const [selectedId, setSelectedId] = useState(null);
            const [expanded, setExpanded] = useState({});

            const filtered = useMemo(() => {
                if (!search.trim()) return settings;
                const q = search.toLowerCase();
                return settings.filter(s => s.label.toLowerCase().includes(q) || s.settingTypeName.toLowerCase().includes(q) ||
                    (s.description || '').toLowerCase().includes(q) || s.fields.some(f => f.name.toLowerCase().includes(q)));
            }, [settings, search]);

            const byCategory = useMemo(() => {
                const out = {};
                for (const s of filtered) (out[s.category] = out[s.category] || []).push(s);
                return out;
            }, [filtered]);

            const selected = settings.find(s => s.id === selectedId);
            const update = (id, patch) => setSettings(settings.map(s => s.id === id ? { ...s, ...patch } : s));
            const save = () => { localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); toast('Saved to browser storage'); };
            const download = () => { downloadText('settings.js', emitJsFile('SETTINGS', settings, `${settings.length} Metadata API setting types.`)); toast('Downloaded settings.js — replace data/settings.js and commit'); };
            const revert = () => {
                if (!confirm('Revert to defaults?')) return;
                localStorage.removeItem(LS_SETTINGS);
                setSettings(JSON.parse(JSON.stringify(window.SETTINGS || [])));
                setSelectedId(null);
                toast('Reverted');
            };

            return (
                <div className="flex h-full">
                    <div className="w-1/3 border-r border-gray-800 flex flex-col">
                        <div className="p-3 border-b border-gray-800">
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-2 flex items-center pointer-events-none"><SearchIcon /></div>
                                <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search settings or fields..."
                                    className="bg-gray-900 border border-gray-800 rounded pl-7 pr-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600" />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto">
                            {CATEGORIES.map(cat => {
                                const items = byCategory[cat.id] || [];
                                if (!items.length) return null;
                                const isOpen = expanded[cat.id] ?? (search.trim().length > 0);
                                return (
                                    <div key={cat.id}>
                                        <button onClick={() => setExpanded(e => ({ ...e, [cat.id]: !isOpen }))}
                                            className="w-full flex items-center justify-between px-3 py-2 text-left hover:bg-gray-900 text-sm">
                                            <span className="flex items-center gap-2">
                                                {isOpen ? <ChevronDownIcon/> : <ChevronRightIcon/>}
                                                <span className="text-gray-300 font-medium">{cat.label}</span>
                                            </span>
                                            <span className="text-[10px] text-gray-500">{items.length}</span>
                                        </button>
                                        {isOpen && items.map(s => (
                                            <button key={s.id} onClick={() => setSelectedId(s.id)}
                                                className={`w-full text-left px-5 py-1.5 text-xs truncate hover:bg-gray-900 ${selectedId === s.id ? 'bg-primary-600/20 text-primary-400' : 'text-gray-400'}`}>
                                                {s.label} <span className="text-gray-600">({s.fields.length})</span>
                                            </button>
                                        ))}
                                    </div>
                                );
                            })}
                        </div>
                        <div className="p-3 border-t border-gray-800 flex flex-col gap-2">
                            <div className="flex gap-2">
                                <button onClick={save} className="flex-1 flex items-center justify-center gap-1 px-2 py-1.5 bg-success-600 hover:bg-success-500 rounded text-xs text-white"><CheckIcon/> Save (browser)</button>
                                <button onClick={download} className="flex-1 flex items-center justify-center gap-1 px-2 py-1.5 bg-primary-600 hover:bg-primary-700 rounded text-xs text-white"><DownloadIcon/> Download</button>
                            </div>
                            <button onClick={revert} className="w-full text-xs text-gray-500 hover:text-red-400">Revert</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto">
                        {selected ? <SettingDetail key={selected.id} setting={selected} update={update} /> : (
                            <div className="h-full flex items-center justify-center text-gray-500 italic">Select a setting from the left.</div>
                        )}
                    </div>
                </div>
            );
        }

        function SettingDetail({ setting, update }) {
            const updateField = (fieldName, patch) => {
                const fields = setting.fields.map(f => f.name === fieldName ? { ...f, ...patch } : f);
                update(setting.id, { fields });
            };
            return (
                <div className="p-6 animate-fade-in max-w-3xl">
                    <h3 className="text-lg font-bold text-white mb-4">{setting.label}</h3>
                    <div className="space-y-4">
                        <Field label="Category">
                            <select value={setting.category} onChange={(e) => update(setting.id, { category: e.target.value })}
                                className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600">
                                {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                            </select>
                        </Field>
                        <Field label="Description">
                            <textarea value={setting.description || ''} onChange={(e) => update(setting.id, { description: e.target.value })}
                                rows={3}
                                className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm text-white focus:outline-none focus:border-primary-600" />
                        </Field>
                        <div className="pt-4 border-t border-gray-800">
                            <div className="text-xs uppercase tracking-wider text-gray-500 mb-2">Fields ({setting.fields.length})</div>
                            <div className="space-y-2">
                                {setting.fields.map(f => (
                                    <div key={f.name} className="p-2 rounded bg-gray-900/60 border border-gray-800">
                                        <div className="flex items-start justify-between gap-2">
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-2 text-sm">
                                                    <span className="font-mono text-gray-200">{f.name}</span>
                                                    <select value={f.type} onChange={(e) => updateField(f.name, { type: e.target.value })}
                                                        className="bg-gray-950 border border-gray-800 rounded px-1 text-[11px] text-gray-400">
                                                        <option value="boolean">boolean</option>
                                                        <option value="string">string</option>
                                                        <option value="number">number</option>
                                                    </select>
                                                </div>
                                                {f.description && <p className="text-[11px] text-gray-500 mt-1 leading-relaxed">{f.description}</p>}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // =============================================================
        // BASELINE EDITOR
        // =============================================================
        function BaselineEditor({ baseline, setBaseline, toast }) {
            const save = () => { localStorage.setItem(LS_BASELINE, JSON.stringify(baseline)); toast('Saved to browser storage'); };
            const download = () => { downloadText('baseline.js', emitJsFile('BASELINE', baseline, 'Scratch-org baseline preselected on first load.')); toast('Downloaded baseline.js — replace data/baseline.js'); };
            const revert = () => { if (!confirm('Revert?')) return; localStorage.removeItem(LS_BASELINE); setBaseline(JSON.parse(JSON.stringify(window.BASELINE || { featureIds: [], settings: {} }))); toast('Reverted'); };

            return (
                <div className="p-6 max-w-3xl animate-fade-in">
                    <h3 className="text-lg font-bold text-white mb-2">Baseline (preselected on first load)</h3>
                    <p className="text-xs text-gray-500 mb-4">
                        These features and settings are checked automatically when a user opens index.html. They can still be unchecked by the user.
                    </p>

                    <div className="space-y-4">
                        <Field label="Feature names (comma-separated)">
                            <input type="text" value={(baseline.featureIds || []).join(', ')}
                                onChange={(e) => setBaseline({ ...baseline, featureIds: e.target.value.split(',').map(s => s.trim()).filter(Boolean) })}
                                className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-sm font-mono text-white focus:outline-none focus:border-primary-600" />
                        </Field>
                        <Field label="Settings (JSON)" hint='Example: {"LightningExperienceSettings": {"enableS1DesktopEnabled": true}}'>
                            <textarea value={JSON.stringify(baseline.settings || {}, null, 2)}
                                onChange={(e) => { try { setBaseline({ ...baseline, settings: JSON.parse(e.target.value) }); } catch {} }}
                                rows={12}
                                className="bg-gray-900 border border-gray-800 rounded px-2 py-1.5 w-full text-xs font-mono text-white focus:outline-none focus:border-primary-600" />
                        </Field>
                        <div className="flex gap-2 pt-4 border-t border-gray-800">
                            <button onClick={save} className="flex items-center gap-1 px-3 py-2 bg-success-600 hover:bg-success-500 rounded text-sm text-white"><CheckIcon/> Save (browser)</button>
                            <button onClick={download} className="flex items-center gap-1 px-3 py-2 bg-primary-600 hover:bg-primary-700 rounded text-sm text-white"><DownloadIcon/> Download baseline.js</button>
                            <button onClick={revert} className="text-sm text-gray-500 hover:text-red-400 ml-auto">Revert</button>
                        </div>
                    </div>
                </div>
            );
        }

        // =============================================================
        // App shell
        // =============================================================
        function App() {
            const [tab, setTab] = useState('features');
            const [features, setFeatures] = useState(() => loadFeatures());
            const [settings, setSettings] = useState(() => loadSettings());
            const [baseline, setBaseline] = useState(() => loadBaseline());
            const [message, setMessage] = useState('');
            const toast = (msg) => { setMessage(msg); setTimeout(() => setMessage(''), 2400); };

            return (
                <div className="h-screen flex flex-col">
                    <div className="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
                        <div>
                            <h1 className="text-xl font-bold text-white">Scratch Org Generator — Admin</h1>
                            <p className="text-xs text-gray-500">
                                Edit features, their attached settings, the full settings catalog, and the default baseline.
                                Download an updated <code className="bg-gray-900 px-1 rounded">.js</code> file and drop it into <code className="bg-gray-900 px-1 rounded">data/</code>.
                                {' '}<a href="index.html" className="text-primary-400 hover:text-primary-500 underline decoration-dotted ml-1">Back to generator</a>
                            </p>
                        </div>
                        <div className="flex items-center gap-3">
                            {message && <span className="text-xs text-success-500 animate-fade-in">{message}</span>}
                            <div className="flex gap-1 bg-gray-900 border border-gray-800 rounded-lg p-1">
                                <button onClick={() => setTab('features')}
                                    className={`px-3 py-1 rounded text-xs font-medium ${tab === 'features' ? 'bg-gray-800 text-white' : 'text-gray-400 hover:text-gray-200'}`}>
                                    Features ({features.length})
                                </button>
                                <button onClick={() => setTab('settings')}
                                    className={`px-3 py-1 rounded text-xs font-medium ${tab === 'settings' ? 'bg-gray-800 text-white' : 'text-gray-400 hover:text-gray-200'}`}>
                                    Settings catalog ({settings.length})
                                </button>
                                <button onClick={() => setTab('baseline')}
                                    className={`px-3 py-1 rounded text-xs font-medium ${tab === 'baseline' ? 'bg-gray-800 text-white' : 'text-gray-400 hover:text-gray-200'}`}>
                                    Baseline
                                </button>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 overflow-hidden">
                        {tab === 'features' && <FeaturesEditor features={features} setFeatures={setFeatures} toast={toast} />}
                        {tab === 'settings' && <SettingsEditor settings={settings} setSettings={setSettings} toast={toast} />}
                        {tab === 'baseline' && <BaselineEditor baseline={baseline} setBaseline={setBaseline} toast={toast} />}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

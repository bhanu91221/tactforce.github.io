<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD to PDF | TactForce Tools</title>
    <meta name="description" content="Paste or drop a Markdown file, preview it live, and export a clean PDF. 100% local, no server.">
    <link rel="icon" type="image/png" href="../../images/logo.png">

    <!-- Theme bridge -->
    <script src="../../js/tools-theme-bridge.js"></script>

    <!-- Tool's external libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Site design system (used by injected nav/footer chrome) -->
    <link rel="stylesheet" href="../../css/style.css">

    <!-- Tailwind (for site chrome) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>

    <!-- Icons + Alpine -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- Content & app -->
    <script src="../../js/content.js"></script>
    <script src="../../js/app.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f9fafb;             /* hybrid: matches site bg-gray-50 */
            --bg-panel: #ffffff;
            --bg-header: #f8f9fa;
            --bg-input: #ffffff;
            --bg-code: #f4f4f4;
            --text: #1f2937;           /* hybrid: matches site text-gray-800 */
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --border: #e5e7eb;         /* hybrid */
            --border-dashed: #cbd5e1;
            --accent: #4a90d9;
            --accent-hover: #3a7bc8;
            --accent-bg: #f0f7ff;
            --accent-light: #e8f4fd;
            --shadow: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg: #111827;             /* hybrid: matches site bg-gray-900 */
            --bg-panel: #1f2937;       /* hybrid: matches site bg-gray-800 */
            --bg-header: #111827;
            --bg-input: #0f172a;
            --bg-code: #0f172a;
            --text: #f3f4f6;           /* hybrid */
            --text-secondary: #d1d5db;
            --text-muted: #9ca3af;
            --border: #374151;         /* hybrid */
            --border-dashed: #4b5563;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --accent-bg: #1e3a5f;
            --accent-light: #1e3a5f;
            --shadow: rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            color: var(--text);
        }

        .tool-shell { padding: 6rem 12px 12px; max-width: 1600px; margin: 0 auto; }

        .tool-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 12px; padding: 0 4px; flex-wrap: wrap; }
        .tool-bar-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .tool-bar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .tool-title-section h1 { color: var(--text); font-size: 22px; display: flex; align-items: center; gap: 8px; }
        .tool-title-section h1 .accent-dot { color: var(--accent); }
        .subtitle { color: var(--text-secondary); font-size: 12px; }

        .upload-btn { background: var(--bg-panel); border: 1px dashed var(--border-dashed); border-radius: 6px; padding: 8px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary); transition: all 0.2s; }
        .upload-btn:hover { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
        .upload-btn input { display: none; }

        .filename-badge { color: var(--text-secondary); font-size: 12px; }

        .btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { background: var(--text-muted); cursor: not-allowed; }
        .btn-secondary { background: var(--bg-panel); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-header); }

        .editor-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: calc(100vh - 180px); min-height: 500px; }
        @media (max-width: 768px) { .editor-container { grid-template-columns: 1fr; height: auto; min-height: 0; } .panel { min-height: 400px; } }

        .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow 0.3s ease, border-color 0.3s ease; }
        .panel:focus-within { border-color: var(--accent); box-shadow: 0 0 20px rgba(74, 144, 217, 0.15); }
        [data-theme="dark"] .panel { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .panel-header { background: var(--bg-header); padding: 14px 20px; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border); font-size: 13px; flex-shrink: 0; text-transform: none; }

        textarea { flex: 1; width: 100%; border: none; padding: 16px; font-family: 'Monaco', 'Menlo', monospace; font-size: 14px; resize: none; outline: none; background: var(--bg-input); color: var(--text); }
        textarea::placeholder { color: var(--text-muted); }

        .preview { flex: 1; padding: 16px; overflow-y: auto; background: var(--bg-input); }
        .preview h1, .preview h2, .preview h3 { margin: 16px 0 8px; color: var(--text); }
        .preview h1 { font-size: 24px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .preview h2 { font-size: 20px; }
        .preview h3 { font-size: 16px; }
        .preview p { margin: 12px 0; line-height: 1.6; color: var(--text-secondary); }
        .preview code { background: var(--bg-code); padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 13px; color: var(--text); }
        .preview pre { background: var(--bg-code); padding: 12px; border-radius: 6px; overflow-x: auto; margin: 12px 0; }
        .preview pre code { background: none; padding: 0; }
        .preview ul, .preview ol { margin: 12px 0; padding-left: 24px; color: var(--text-secondary); }
        .preview li { margin: 4px 0; line-height: 1.6; }
        .preview blockquote { border-left: 4px solid var(--border); margin: 12px 0; padding-left: 16px; color: var(--text-muted); }
        .preview a { color: var(--accent); }
        .preview table { border-collapse: collapse; width: 100%; margin: 12px 0; }
        .preview th, .preview td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; color: var(--text); }
        .preview th { background: var(--bg-header); }
        .preview img { max-width: 100%; height: auto; }

        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 15mm; }
        }
    </style>
</head>
<body x-data="toolsApp">

    <!-- Site header -->
    <header id="main-header"
            x-init="$el.innerHTML = window.renderHeader({ basePath: '../../' }); $nextTick(() => lucide.createIcons({ root: $el }))">
    </header>

    <main class="tool-shell">
        <div class="tool-bar">
            <div class="tool-bar-left">
                <div class="tool-title-section">
                    <h1><span class="accent-dot">📄</span> Markdown to PDF</h1>
                    <p class="subtitle">100% local • No server • <a href="../../tools.html" style="color: var(--accent); text-decoration: none;">← All Tools</a></p>
                </div>
            </div>
            <div class="tool-bar-right">
                <label class="upload-btn" id="uploadArea">
                    <input type="file" id="fileInput" accept=".md,.markdown,.txt">
                    📁 Upload .md
                </label>
                <span class="filename-badge" id="filename"></span>
                <button class="btn btn-secondary" id="printBtn" title="Print or Save as PDF with selectable text">🖨️ Print</button>
                <button class="btn" id="downloadBtn">⬇️ Download PDF</button>
            </div>
        </div>

        <div id="printArea"></div>

        <div class="editor-container">
            <div class="panel">
                <div class="panel-header">✏️ Markdown Input</div>
                <textarea id="editor" placeholder="Paste or type your Markdown here...

# Example Heading

This is a **bold** and *italic* text.

- Item 1
- Item 2
- Item 3

```code block```
"></textarea>
            </div>
            <div class="panel">
                <div class="panel-header">👁️ Preview</div>
                <div class="preview" id="preview"></div>
            </div>
        </div>
    </main>

    <script>
        let currentFileName = 'document';
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const filenameDisplay = document.getElementById('filename');
        const downloadBtn = document.getElementById('downloadBtn');
        const printBtn = document.getElementById('printBtn');
        const printArea = document.getElementById('printArea');

        marked.setOptions({ breaks: true, gfm: true });

        function updatePreview() { preview.innerHTML = marked.parse(editor.value); }
        editor.addEventListener('input', updatePreview);

        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            currentFileName = file.name.replace(/\.(md|markdown|txt)$/i, '');
            filenameDisplay.textContent = `📎 ${file.name}`;
            filenameDisplay.style.display = 'inline-block';
            const reader = new FileReader();
            reader.onload = (e) => {
                editor.value = e.target.result;
                updatePreview();
            };
            reader.readAsText(file);
        }

        printBtn.addEventListener('click', () => {
            const md = editor.value;
            if (!md.trim()) { alert('Please enter some Markdown content first.'); return; }
            printArea.innerHTML = `<style>
                @page { margin: 15mm; }
                body { font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.6; color: #000; }
                h1 { font-size: 20pt; margin: 0 0 12pt; border-bottom: 1pt solid #333; padding-bottom: 6pt; }
                h2 { font-size: 16pt; margin: 18pt 0 10pt; }
                h3 { font-size: 13pt; margin: 14pt 0 8pt; }
                p { margin: 0 0 10pt; }
                code { background: #f0f0f0; padding: 1pt 4pt; font-family: Consolas, monospace; font-size: 10pt; }
                pre { background: #f5f5f5; padding: 10pt; margin: 10pt 0; font-family: Consolas, monospace; font-size: 9pt; white-space: pre-wrap; }
                pre code { background: none; padding: 0; }
                ul, ol { margin: 8pt 0; padding-left: 20pt; }
                li { margin: 4pt 0; }
                blockquote { border-left: 3pt solid #666; margin: 10pt 0; padding-left: 12pt; color: #444; }
                table { border-collapse: collapse; width: 100%; margin: 10pt 0; }
                th, td { border: 0.5pt solid #999; padding: 6pt 8pt; font-size: 10pt; }
                th { background: #f0f0f0; }
                a { color: #0055cc; }
            </style>${marked.parse(md)}`;
            printArea.style.display = 'block';
            window.print();
            printArea.style.display = 'none';
        });

        downloadBtn.addEventListener('click', async () => {
            const md = editor.value;
            if (!md.trim()) { alert('Please enter some Markdown content first.'); return; }
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '⏳ Generating...';
            const { jsPDF } = window.jspdf;
            const margin = 15;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const contentWidth = pdfWidth - (margin * 2);
            const contentHeight = pdfHeight - (margin * 2);
            const scale = 2;
            const containerWidth = contentWidth * 3.78 * scale;
            const pageHeightPx = contentHeight * 3.78 * scale;
            const printContainer = document.createElement('div');
            printContainer.style.cssText = `position:absolute;left:0;top:0;width:${containerWidth/scale}px;padding:0;font-family:Arial,sans-serif;font-size:14px;line-height:1.6;color:#000;background:#fff;`;
            printContainer.innerHTML = `<style>
                *{box-sizing:border-box}
                h1,h2,h3{margin:20px 0 10px;color:#000;page-break-after:avoid}
                h1{font-size:26px;border-bottom:2px solid #333;padding-bottom:10px}
                h2{font-size:20px}h3{font-size:16px}
                p{margin:12px 0;color:#333}
                code{background:#f0f0f0;padding:2px 6px;border-radius:4px;font-family:Consolas,monospace;font-size:12px}
                pre{background:#f0f0f0;padding:14px;border-radius:6px;overflow-x:auto;margin:14px 0;page-break-inside:avoid}
                pre code{background:none;padding:0}
                ul,ol{margin:12px 0;padding-left:24px}
                li{margin:5px 0}
                blockquote{border-left:4px solid #666;margin:14px 0;padding-left:16px;color:#555;font-style:italic}
                table{border-collapse:collapse;width:100%;margin:14px 0;page-break-inside:avoid}
                th,td{border:1px solid #ccc;padding:8px 12px;text-align:left}
                th{background:#f5f5f5;font-weight:bold}
                a{color:#0066cc}
                img{max-width:100%;height:auto;page-break-inside:avoid}
            </style>${marked.parse(md)}`;
            document.body.appendChild(printContainer);
            await new Promise(r => setTimeout(r, 300));
            try {
                const canvas = await html2canvas(printContainer, {
                    scale: scale, useCORS: true, logging: false,
                    backgroundColor: '#ffffff', windowWidth: containerWidth / scale
                });
                const totalHeight = canvas.height;
                const pageCount = Math.ceil(totalHeight / pageHeightPx);
                for (let i = 0; i < pageCount; i++) {
                    if (i > 0) pdf.addPage();
                    const srcY = i * pageHeightPx;
                    const srcHeight = Math.min(pageHeightPx, totalHeight - srcY);
                    const pageCanvas = document.createElement('canvas');
                    pageCanvas.width = canvas.width;
                    pageCanvas.height = srcHeight;
                    const ctx = pageCanvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
                    ctx.drawImage(canvas, 0, srcY, canvas.width, srcHeight, 0, 0, canvas.width, srcHeight);
                    const pageImgData = pageCanvas.toDataURL('image/jpeg', 0.95);
                    const imgHeight = (srcHeight / scale) / 3.78;
                    pdf.addImage(pageImgData, 'JPEG', margin, margin, contentWidth, imgHeight);
                }
                pdf.save(`${currentFileName}.pdf`);
            } catch (err) {
                console.error(err);
                alert('Error generating PDF. Please try again.');
            }
            document.body.removeChild(printContainer);
            downloadBtn.disabled = false;
            downloadBtn.innerHTML = '⬇️ Download PDF';
        });

        updatePreview();

        // Site header scroll effect — single class toggle
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (!header) return;
            header.classList.toggle('tf-scrolled', window.scrollY > 50);
        });
        document.addEventListener('alpine:initialized', () => setTimeout(() => lucide.createIcons(), 100));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — TactForce</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/images/logo.png">

    <script>
      (function() {
        var saved = localStorage.getItem("theme");
        var isDark = saved !== "light";
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

    <style>
      body { min-height: 100vh; display: flex; flex-direction: column; }
      .nf-shell { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; position: relative; overflow: hidden; }
      .nf-shell .grid {
        position: absolute; inset: 0; opacity: 0.4; pointer-events: none;
        background-image:
          linear-gradient(to right, var(--rule) 1px, transparent 1px),
          linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
        background-size: 80px 80px;
        -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
                mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      }
      .nf-shell .glow {
        position: absolute; left: 50%; top: 0; transform: translateX(-50%);
        width: 700px; height: 600px; border-radius: 50%;
        background: radial-gradient(circle, var(--accent-soft) 0%, transparent 60%);
        pointer-events: none; filter: blur(40px);
      }
      .nf-content { position: relative; z-index: 1; max-width: 720px; width: 100%; }
      .nf-code {
        font-family: var(--font-mono);
        font-size: clamp(96px, 18vw, 220px);
        font-weight: 500; letter-spacing: -0.05em; line-height: 1;
        color: var(--fg); margin: 0 0 16px;
      }
      .nf-code .accent { color: var(--accent); }
    </style>
</head>
<body>
  <main class="nf-shell">
    <div class="grid" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="nf-content">
      <div class="tf-pill" style="margin-bottom: 28px;">
        <span class="tf-pill__dot"></span>
        <span>STATUS: 404 · ROUTE NOT FOUND</span>
      </div>

      <h1 class="nf-code">4<span class="accent">0</span>4</h1>
      <h2 class="tf-h2" style="font-size: clamp(28px, 4vw, 44px); margin-bottom: 16px;">Page not found.</h2>
      <p class="tf-body" style="margin-bottom: 32px; max-width: 480px;">
        The route you tried doesn't exist on this host. Maybe it moved, or maybe it never did.
      </p>

      <div class="tf-term" style="margin-top: 0; max-width: 600px;">
        <div class="tf-term__bar">
          <span class="tf-term__dot tf-term__dot--r"></span>
          <span class="tf-term__dot tf-term__dot--y"></span>
          <span class="tf-term__dot tf-term__dot--g"></span>
          <span class="tf-term__title">tactforce — bash</span>
        </div>
        <div class="tf-term__body">
          <div><span class="prompt">$</span>cat /404</div>
          <div class="out">cat: /404: No such file or directory</div>
          <div><span class="prompt">$</span>cd /<span class="tf-term__cursor">▌</span></div>
        </div>
      </div>

      <div style="margin-top: 36px; display:flex; gap: 12px; flex-wrap: wrap;">
        <a href="/" class="tf-btn tf-btn--primary">cd / →</a>
        <a href="/tools.html" class="tf-btn tf-btn--ghost">browse tools</a>
      </div>
    </div>
  </main>

  <footer style="padding: 32px 24px; text-align: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; color: var(--dim);">
    <a href="/" style="color: var(--dim-2); text-decoration: none;">© 2026 TACTFORCE</a>
  </footer>
</body>
</html>

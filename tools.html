<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools | TactForce</title>
    <meta name="description" content="Free, browser-based utilities by TactForce — built for Salesforce admins, developers, and anyone who works with data.">
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- OG / Twitter -->
    <meta property="og:title" content="Tools | TactForce">
    <meta property="og:description" content="Free, browser-based utilities by TactForce.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tactforce.ca/tools.html">
    <meta property="og:image" content="https://tactforce.ca/images/TactForce.png">
    <meta name="twitter:card" content="summary_large_image">

    <script>
      (function() {
        var saved = localStorage.getItem("theme");
        var isDark = saved !== "light";
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Geist','sans-serif'], mono: ['Geist Mono','monospace'] } } } };</script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/content.js"></script>
    <script src="js/app.js"></script>
</head>
<body x-data="toolsApp" x-cloak>

  <!-- Shared header injected by renderHeader() -->
  <header id="main-header" x-init="$el.innerHTML = window.renderHeader()"></header>

  <main style="padding-top: 80px;">
    <!-- Hero -->
    <section class="tf-hero" style="padding: 100px 0 60px;">
      <div class="tf-hero__grid-bg" aria-hidden="true"></div>
      <div class="tf-hero__glow" aria-hidden="true"></div>
      <div class="tf-hero__inner">
        <div class="tf-pill animate-fade-in">
          <span class="tf-pill__dot"></span>
          <span x-text="content.toolsMeta.caption"></span>
        </div>
        <h1 class="tf-hero__h1 animate-fade-in-up" style="margin-top: 32px;">
          Browser-based<br>
          <span class="tf-accent">utilities.</span>
        </h1>
        <p class="tf-hero__sub animate-fade-in-up" style="max-width: 600px; margin-top: 24px;">
          A growing collection of small, focused utilities for Salesforce admins, developers, and anyone who works with data. 100% local. No sign-up.
        </p>
      </div>
    </section>

    <!-- Tools Grid -->
    <section class="tf-section">
      <div class="tf-wrap">
        <div class="tf-tools">
          <template x-for="t in visibleTools" :key="t.id">
            <a :href="t.url" class="tf-tool-card reveal">
              <div class="tf-tool-card__cmd" x-text="t.cmd || ('$ tf ' + t.id)"></div>
              <h3 class="tf-tool-card__name" x-text="t.name"></h3>
              <p class="tf-tool-card__desc" x-text="t.description"></p>
              <div class="tf-tool-card__foot">
                <span class="tag">100% LOCAL</span>
                <span class="arrow">→</span>
              </div>
            </a>
          </template>
        </div>

        <div class="empty" style="margin-top: 48px;" x-show="visibleTools.length === 0">// no tools registered yet</div>

        <div style="margin-top: 64px; text-align: center;">
          <span class="tf-mono-caption">// more tools coming soon</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="tf-footer">
    <div class="tf-wrap">
      <div class="tf-footer__wordmark">TACT<span class="tf-accent">FORCE</span></div>
      <div class="tf-footer__row">
        <div x-text="content.footer.copyright"></div>
        <div x-text="content.about.location || 'BHANU VAKATI · TORONTO, CA'"></div>
        <div class="tf-footer__links">
          <a :href="content.footer.linkedInLink" target="_blank" rel="noreferrer">LINKEDIN ↗</a>
          <a :href="content.footer.buyMeCoffeeLink" target="_blank" rel="noreferrer">BMC ↗</a>
          <a href="index.html">HOME</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>

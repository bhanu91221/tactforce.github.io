<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TactForce Admin CMS</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <!-- Load content (window.siteContent) -->
    <script src="js/content.js"></script>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('admin', () => ({
                data: JSON.parse(JSON.stringify(window.siteContent)), // Deep copy from global
                activeTab: 'guides', // guides, content, apps
                selectedGuide: 'dynamic-path',
                authed: false,
                passkey: '',
                quillInstances: {},

                login() {
                    if (this.passkey === 'tactforce' || this.passkey === 'admin') {
                        this.authed = true;
                        // Wait for DOM to update then init existing quills if any
                        this.$nextTick(() => {
                            // Init logic handled by x-init on elements usually, 
                            // but we might need re-init when tabs change
                        });
                    } else {
                        alert('Invalid Passkey');
                    }
                },

                // --- Apps Management ---
                addApp() {
                    const id = prompt("Enter App ID (e.g., 'new-app'):");
                    if (!id) return;

                    this.data.products.push({
                        id: id.toLowerCase().replace(/\s+/g, '-'),
                        name: "New App",
                        description: "App Description",
                        features: ["Feature 1", "Feature 2"],
                        image: "images/placeholder.png",
                        appExchangeLink: "#",
                        guideLink: "guides.html?id=" + id
                    });

                    // Also create a blank guide entry
                    if (!this.data.guides[id]) {
                        this.data.guides[id] = {
                            title: "New App User Guide",
                            versions: [],
                            sections: []
                        };
                    }
                    alert("App created! Don't forget to configure its Guide in the 'User Guides' tab.");
                },

                removeApp(index) {
                    if (confirm('Are you sure? This removes the app from the homepage.')) {
                        this.data.products.splice(index, 1);
                    }
                },

                addFeature(productIndex) {
                    this.data.products[productIndex].features.push("New Feature");
                },

                removeFeature(productIndex, featureIndex) {
                    this.data.products[productIndex].features.splice(featureIndex, 1);
                },

                // --- Guides Management ---
                addVersion() {
                    if (!this.data.guides[this.selectedGuide].versions) {
                        this.data.guides[this.selectedGuide].versions = [];
                    }
                    this.data.guides[this.selectedGuide].versions.unshift({
                        version: "1.X",
                        date: new Date().toISOString().split('T')[0],
                        description: "New update description"
                    });
                },

                removeVersion(index) {
                    if (confirm('Delete this version entry?')) {
                        this.data.guides[this.selectedGuide].versions.splice(index, 1);
                    }
                },

                addSection() {
                    const id = prompt("Enter Section ID (e.g., 'setup'):");
                    if (id) {
                        this.data.guides[this.selectedGuide].sections.push({
                            id: id.toLowerCase().replace(/\s+/g, '-'),
                            title: "New Section",
                            content: "<p>Content goes here...</p>"
                        });
                        // Re-init Quill for the new section
                        this.$nextTick(() => {
                            // Handled by x-init in the DOM
                        });
                    }
                },

                removeSection(index) {
                    if (confirm('Delete this entire section?')) {
                        this.data.guides[this.selectedGuide].sections.splice(index, 1);
                    }
                },

                // --- Export ---
                exportParams() {
                    const fileContent = `window.siteContent = ${JSON.stringify(this.data, null, 4)};`;
                    const blob = new Blob([fileContent], { type: 'text/javascript' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'content.js';
                    a.click();
                    URL.revokeObjectURL(url);
                    alert('Configuration downloaded! Replace /js/content.js in your repository with this file to apply changes.');
                },

                initQuill(el, model, index, type) {
                    const quill = new Quill(el, {
                        theme: 'snow',
                        modules: {
                            toolbar: [
                                ['bold', 'italic', 'underline', 'strike'],
                                ['blockquote', 'code-block'],
                                [{ 'header': 1 }, { 'header': 2 }],
                                [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                                [{ 'color': [] }, { 'background': [] }],
                                ['clean']
                            ]
                        }
                    });

                    // Set initial content
                    quill.root.innerHTML = model;

                    // Update Alpine model on change
                    quill.on('text-change', () => {
                        if (type === 'section') {
                            this.data.guides[this.selectedGuide].sections[index].content = quill.root.innerHTML;
                        }
                    });
                }
            }));
        });
    </script>
    <style>
        .ql-editor {
            min-height: 200px;
            background: white;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen font-sans" x-data="admin">

    <!-- Login -->
    <div x-show="!authed" class="fixed inset-0 flex items-center justify-center bg-gray-900 z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
            <h1 class="text-2xl font-bold mb-6">CMS Access</h1>
            <input type="password" x-model="passkey" @keydown.enter="login()" placeholder="Enter Passkey"
                class="w-full px-4 py-3 border rounded-lg mb-4 text-lg">
            <button @click="login()"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Unlock
                Dashboard</button>
            <p class="mt-4 text-gray-400 text-sm">Default: 'admin'</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div x-show="authed" class="min-h-screen flex flex-col">

        <!-- Header -->
        <header class="bg-white shadow z-10 sticky top-0">
            <div class="w-full px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">A
                    </div>
                    <span class="font-bold text-gray-800">TactForce CMS</span>
                </div>
                <div class="flex gap-4">
                    <button @click="exportParams()"
                        class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5">
                        <i data-lucide="save" class="w-4 h-4"></i>
                        Download Config
                    </button>
                </div>
            </div>
        </header>

        <div class="flex flex-1 w-full gap-0">

            <!-- Sidebar Navigation -->
            <nav class="w-64 bg-white border-r shrink-0 min-h-[calc(100vh-4rem)]">
                <div class="p-4 space-y-1">
                    <button @click="activeTab = 'guides'"
                        :class="{'bg-blue-50 text-blue-700 font-semibold': activeTab === 'guides', 'text-gray-600 hover:bg-gray-50': activeTab !== 'guides'}"
                        class="w-full text-left px-4 py-3 rounded-lg transition flex items-center gap-3">
                        <i data-lucide="book" class="w-5 h-5"></i>
                        User Guides
                    </button>
                    <button @click="activeTab = 'apps'"
                        :class="{'bg-blue-50 text-blue-700 font-semibold': activeTab === 'apps', 'text-gray-600 hover:bg-gray-50': activeTab !== 'apps'}"
                        class="w-full text-left px-4 py-3 rounded-lg transition flex items-center gap-3">
                        <i data-lucide="box" class="w-5 h-5"></i>
                        Manage Apps
                    </button>
                    <button @click="activeTab = 'content'"
                        :class="{'bg-blue-50 text-blue-700 font-semibold': activeTab === 'content', 'text-gray-600 hover:bg-gray-50': activeTab !== 'content'}"
                        class="w-full text-left px-4 py-3 rounded-lg transition flex items-center gap-3">
                        <i data-lucide="layout" class="w-5 h-5"></i>
                        Site Content
                    </button>
                </div>
            </nav>

            <!-- Main Panel -->
            <main class="flex-1 bg-gray-50 p-8 overflow-y-auto h-[calc(100vh-4rem)]">

                <!-- Guides Tab -->
                <div x-show="activeTab === 'guides'" class="max-w-6xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">Manage Documentation</h2>
                        <select x-model="selectedGuide"
                            class="px-4 py-2 border rounded-lg bg-white shadow-sm font-medium">
                            <template x-for="(guide, key) in data.guides">
                                <option :value="key" x-text="guide.title"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Version History -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border mb-8">
                        <div class="flex justify-between items-center mb-4 border-b pb-2">
                            <h3 class="font-bold text-gray-800 flex items-center gap-2">
                                <i data-lucide="clock" class="w-4 h-4 text-blue-600"></i> Version History
                            </h3>
                            <button @click="addVersion()"
                                class="text-sm bg-blue-50 text-blue-600 px-3 py-1 rounded hover:bg-blue-100">+ Add
                                Version</button>
                        </div>
                        <div class="space-y-4">
                            <template x-for="(ver, idx) in data.guides[selectedGuide].versions">
                                <div
                                    class="grid grid-cols-1 md:grid-cols-12 gap-4 items-start bg-gray-50 p-4 rounded-lg relative group">
                                    <div class="md:col-span-2">
                                        <label class="text-xs text-gray-500 uppercase">Version</label>
                                        <input type="text" x-model="ver.version"
                                            class="w-full bg-white border rounded px-2 py-1">
                                    </div>
                                    <div class="md:col-span-3">
                                        <label class="text-xs text-gray-500 uppercase">Date</label>
                                        <input type="date" x-model="ver.date"
                                            class="w-full bg-white border rounded px-2 py-1">
                                    </div>
                                    <div class="md:col-span-6">
                                        <label class="text-xs text-gray-500 uppercase">Description</label>
                                        <input type="text" x-model="ver.description"
                                            class="w-full bg-white border rounded px-2 py-1">
                                    </div>
                                    <div class="md:col-span-1 text-right">
                                        <button @click="removeVersion(idx)" class="text-red-400 hover:text-red-600 p-2"
                                            title="Remove Version">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                                                <path d="M3 6h18" />
                                                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                                                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                                                <line x1="10" x2="10" y1="11" y2="17" />
                                                <line x1="14" x2="14" y1="11" y2="17" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <div x-show="!data.guides[selectedGuide] || !data.guides[selectedGuide].versions || data.guides[selectedGuide].versions.length === 0"
                                class="text-center text-gray-400 py-4 italic">No versions logged.</div>
                        </div>
                    </div>

                    <!-- Sections Editor (Rich Text) -->
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-gray-800 text-xl">Guide Sections</h3>
                            <button @click="addSection()"
                                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 shadow-sm transition flex items-center gap-2">
                                <i data-lucide="plus" class="w-4 h-4"></i> Add Section
                            </button>
                        </div>

                        <template x-for="(sec, idx) in data.guides[selectedGuide].sections" :key="sec.id + idx">
                            <div class="bg-white p-6 rounded-xl shadow-sm border relative">
                                <div class="flex justify-between items-center mb-4">
                                    <input type="text" x-model="sec.title"
                                        class="text-lg font-bold border-b border-transparent hover:border-gray-300 focus:border-blue-500 outline-none w-1/2 transition"
                                        placeholder="Section Title">
                                    <button @click="removeSection(idx)"
                                        class="text-red-500 text-sm hover:underline">Remove Section</button>
                                </div>

                                <!-- Quill Container -->
                                <div x-init="initQuill($el, sec.content, idx, 'section')"></div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Manage Apps Tab -->
                <div x-show="activeTab === 'apps'" class="max-w-6xl mx-auto">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-2xl font-bold">Manage Apps</h2>
                        <button @click="addApp()"
                            class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 shadow-md transition flex items-center gap-2">
                            <i data-lucide="plus-circle" class="w-5 h-5"></i> New App
                        </button>
                    </div>

                    <div class="grid grid-cols-1 gap-8">
                        <template x-for="(prod, idx) in data.products">
                            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                                <div class="bg-gray-50 px-6 py-3 border-b flex justify-between items-center">
                                    <h3 class="font-bold text-gray-700" x-text="prod.name"></h3>
                                    <button @click="removeApp(idx)"
                                        class="text-red-500 hover:text-red-700 text-sm">Delete App</button>
                                </div>
                                <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="space-y-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-500 mb-1">App Name</label>
                                            <input type="text" x-model="prod.name"
                                                class="w-full border rounded-lg px-3 py-2">
                                        </div>
                                        <div>
                                            <label
                                                class="block text-sm font-medium text-gray-500 mb-1">Description</label>
                                            <textarea x-model="prod.description" rows="3"
                                                class="w-full border rounded-lg px-3 py-2"></textarea>
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-500 mb-1">AppExchange
                                                Link</label>
                                            <input type="text" x-model="prod.appExchangeLink"
                                                class="w-full border rounded-lg px-3 py-2 text-blue-600">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-500 mb-1">Image
                                                Path</label>
                                            <input type="text" x-model="prod.image"
                                                class="w-full border rounded-lg px-3 py-2 text-gray-600">
                                        </div>
                                    </div>

                                    <div class="space-y-4">
                                        <label class="block text-sm font-medium text-gray-500 mb-1">Key Features</label>
                                        <div class="space-y-2">
                                            <template x-for="(feat, fIdx) in prod.features">
                                                <div class="flex gap-2">
                                                    <input type="text" x-model="prod.features[fIdx]"
                                                        class="flex-1 border rounded px-3 py-1 text-sm">
                                                    <button @click="removeFeature(idx, fIdx)"
                                                        class="text-gray-400 hover:text-red-500 p-1"
                                                        title="Remove Feature">
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                            stroke-width="2" stroke-linecap="round"
                                                            stroke-linejoin="round" class="w-4 h-4">
                                                            <path d="M18 6 6 18" />
                                                            <path d="m6 6 12 12" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </template>
                                            <button @click="addFeature(idx)"
                                                class="text-sm text-blue-600 hover:underline">+ Add Feature</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Site Content Tab -->
                <div x-show="activeTab === 'content'" class="max-w-4xl mx-auto">
                    <h2 class="text-2xl font-bold mb-6">General Site Content</h2>
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-xl border shadow-sm">
                            <h3 class="text-lg font-bold mb-4 text-gray-800">Hero Section</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">Main Heading</label>
                                    <input type="text" x-model="data.hero.title"
                                        class="w-full px-3 py-2 border rounded-lg">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">Subtitle</label>
                                    <textarea x-model="data.hero.subtitle" rows="2"
                                        class="w-full px-3 py-2 border rounded-lg"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl border shadow-sm">
                            <h3 class="text-lg font-bold mb-4 text-gray-800">About Us</h3>
                            <div class="space-y-4">
                                <template x-for="(para, idx) in data.about.text">
                                    <div>
                                        <label class="block text-sm font-medium mb-1"
                                            x-text="'Paragraph ' + (idx + 1)"></label>
                                        <textarea x-model="data.about.text[idx]" rows="3"
                                            class="w-full px-3 py-2 border rounded-lg"></textarea>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>

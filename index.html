<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-data="site" x-text="content.meta.title">TactForce</title>
    <meta name="description" content="Showcasing AppExchange Solutions Dynamic Path and Rocket Reports by TactForce">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind (Dev Mode CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#007bff',
                        secondary: '#6c757d',
                        dark: '#111827' // slate-900
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- App Logic -->
    <script src="js/content.js"></script>
    <script src="js/app.js"></script>
</head>

<body class="bg-gray-50 text-gray-900 font-sans antialiased selection:bg-primary selection:text-white" x-data="site">

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 transition-all duration-300 glass-panel">
        <nav class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#" class="text-2xl font-bold tracking-tight text-gray-900 flex items-center gap-2">
                <img src="images/logo.png" alt="TactForce" class="h-10 w-auto" onerror="this.hidden=true">
                <span x-show="!$el.previousElementSibling.src">TactForce</span>
            </a>

            <!-- Desktop Nav -->
            <ul class="hidden md:flex space-x-8 items-center">
                <template x-for="link in content.navigation">
                    <div>
                        <!-- Regular Links -->
                        <template x-if="link.label !== 'Solutions'">
                            <li><a :href="link.href"
                                    class="text-gray-600 hover:text-primary transition font-medium text-sm tracking-wide"
                                    x-text="link.label"></a></li>
                        </template>

                        <!-- Solutions Dropdown -->
                        <template x-if="link.label === 'Solutions'">
                            <li x-data="{ open: false }" class="relative group" @mouseenter="open = true"
                                @mouseleave="open = false">
                                <button
                                    class="text-gray-600 group-hover:text-primary transition font-medium text-sm tracking-wide flex items-center gap-1 py-2 outline-none">
                                    <span x-text="link.label"></span>
                                    <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200"
                                        :class="open ? 'rotate-180' : ''"></i>
                                </button>

                                <!-- Dropdown Menu -->
                                <div x-show="open" x-transition:enter="transition ease-out duration-200"
                                    x-transition:enter-start="opacity-0 translate-y-2"
                                    x-transition:enter-end="opacity-100 translate-y-0"
                                    x-transition:leave="transition ease-in duration-150"
                                    x-transition:leave-start="opacity-100 translate-y-0"
                                    x-transition:leave-end="opacity-0 translate-y-2"
                                    class="absolute top-full -left-4 mt-0 w-64 bg-white/90 backdrop-blur-md rounded-2xl shadow-xl border border-white/20 overflow-hidden py-2 z-50 ring-1 ring-black/5"
                                    style="display: none;">

                                    <template x-for="product in content.products">
                                        <a :href="'#' + product.id"
                                            class="block px-4 py-3 group/item hover:bg-gray-50 transition">
                                            <div class="font-medium text-gray-900 group-hover/item:text-primary transition"
                                                x-text="product.name"></div>
                                            <div class="text-xs text-gray-500 mt-0.5 line-clamp-2"
                                                x-text="product.description"></div>
                                        </a>
                                    </template>
                                </div>
                            </li>
                        </template>
                    </div>
                </template>
            </ul>

            <!-- Mobile Menu Button -->
            <button @click="toggleMenu()" class="md:hidden text-gray-900 focus:outline-none">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </nav>

        <!-- Mobile Nav -->
        <div x-show="mobileMenuOpen" x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
            class="md:hidden absolute top-20 left-0 w-full bg-white border-b shadow-lg p-6">
            <ul class="space-y-4 text-center">
                <template x-for="link in content.navigation">
                    <li class="block">
                        <!-- Regular Links -->
                        <template x-if="link.label !== 'Solutions'">
                            <a :href="link.href" @click="toggleMenu()" class="block text-gray-800 font-medium"
                                x-text="link.label"></a>
                        </template>

                        <!-- Solutions Accordion -->
                        <template x-if="link.label === 'Solutions'">
                            <div x-data="{ expanded: false }" class="flex flex-col items-center">
                                <button @click="expanded = !expanded"
                                    class="text-gray-800 font-medium flex items-center justify-center gap-2 w-full py-1">
                                    <span x-text="link.label"></span>
                                    <i data-lucide="chevron-down" class="w-4 h-4 transition-transform"
                                        :class="expanded ? 'rotate-180' : ''"></i>
                                </button>

                                <div x-show="expanded" class="space-y-3 mt-3 w-full bg-gray-50 rounded-xl p-4">
                                    <template x-for="product in content.products">
                                        <a :href="'#' + product.id" @click="toggleMenu()"
                                            class="block text-gray-600 text-sm hover:text-primary transition font-medium"
                                            x-text="product.name"></a>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </li>
                </template>
            </ul>
        </div>
    </header>

    <!-- Hero -->
    <section class="relative min-h-screen flex items-center justify-center pt-20 overflow-hidden hero-gradient">
        <div class="max-w-5xl mx-auto px-6 text-center reveal">
            <h1 class="text-6xl md:text-8xl font-bold tracking-tighter mb-8 bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-600"
                x-text="content.hero.title"></h1>
            <p class="text-xl md:text-2xl text-gray-500 max-w-2xl mx-auto mb-12 leading-relaxed font-light"
                x-text="content.hero.subtitle"></p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a :href="content.hero.ctaLink"
                    class="px-8 py-4 bg-gray-900 text-white rounded-full font-semibold hover:bg-gray-800 transition shadow-lg transform hover:-translate-y-1"
                    x-text="content.hero.cta"></a>
            </div>
        </div>

        <!-- Background Elements -->
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -z-10 animate-blob">
        </div>
    </section>

    <!-- Products -->
    <section id="solutions" class="py-32 px-6">
        <div class="max-w-7xl mx-auto space-y-32"
            x-init="$nextTick(() => { if(window.initScrollReveal) window.initScrollReveal(); })">

            <template x-for="(product, index) in content.products">
                <div :id="product.id" class="grid md:grid-cols-2 gap-16 items-center reveal group cursor-default">
                    <div :class="{'md:order-2': index % 2 !== 0}"
                        class="transform transition duration-700 md:group-hover:scale-105">
                        <div class="relative rounded-3xl overflow-hidden shadow-2xl bg-gray-100">
                            <img :src="product.image" :alt="product.name" loading="lazy"
                                class="w-full h-auto object-cover">
                        </div>
                    </div>
                    <div :class="{'md:order-1': index % 2 !== 0}" class="transform transition duration-700">
                        <h2 class="text-4xl md:text-5xl font-bold mb-6 tracking-tight text-gray-900"
                            x-text="product.name"></h2>
                        <p class="text-lg text-gray-500 mb-8 leading-relaxed" x-text="product.description"></p>

                        <ul class="space-y-4 mb-10">
                            <template x-for="feature in product.features">
                                <li class="flex items-start text-gray-600">
                                    <i data-lucide="check-circle" class="w-5 h-5 text-primary mr-3 mt-1 shrink-0"></i>
                                    <span x-text="feature"></span>
                                </li>
                            </template>
                        </ul>

                        <div class="flex flex-wrap gap-4">
                            <a :href="product.appExchangeLink" target="_blank"
                                class="px-6 py-3 bg-primary text-white rounded-lg font-medium hover:bg-blue-600 transition flex items-center gap-2 transform hover:scale-105">
                                <i data-lucide="download-cloud" class="w-4 h-4"></i>
                                AppExchange
                            </a>
                            <a :href="product.guideLink"
                                class="px-6 py-3 bg-gray-100 text-gray-900 rounded-lg font-medium hover:bg-gray-200 transition flex items-center gap-2 transform hover:scale-105">
                                <i data-lucide="book-open" class="w-4 h-4"></i>
                                Use Guide
                            </a>
                        </div>
                    </div>
                </div>
            </template>

        </div>
    </section>

    <!-- About -->
    <section class="py-32 bg-gray-900 text-white reveal">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <h2 class="text-3xl font-bold mb-8" x-text="content.about.title"></h2>
            <div class="space-y-6 text-xl text-gray-300 font-light leading-relaxed">
                <template x-for="para in content.about.text">
                    <p x-text="para"></p>
                </template>
            </div>
        </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="py-32 px-6 bg-gray-50">
        <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl p-8 md:p-12 reveal border border-gray-100">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold mb-4" x-text="content.contact.title"></h2>
                <p class="text-gray-500" x-text="content.contact.subtitle"></p>
            </div>

            <form :action="content.contact.formAction" method="POST" class="space-y-6">
                <!-- Hidden Fields -->
                <input type="hidden" name="orgid" :value="content.contact.orgId">
                <input type="hidden" name="retURL" :value="content.contact.retURL">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                        <input name="name" type="text" maxlength="80" required
                            class="w-full px-4 py-3 rounded-lg bg-gray-50 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Company</label>
                        <input name="company" type="text" maxlength="80"
                            class="w-full px-4 py-3 rounded-lg bg-gray-50 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input name="email" type="email" maxlength="80" required
                            class="w-full px-4 py-3 rounded-lg bg-gray-50 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input name="phone" type="tel" maxlength="40"
                            class="w-full px-4 py-3 rounded-lg bg-gray-50 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                    <input name="subject" type="text" maxlength="80" required
                        class="w-full px-4 py-3 rounded-lg bg-gray-50 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea name="description" rows="4" required
                        class="w-full px-4 py-3 rounded-lg bg-gray-50 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition"></textarea>
                </div>

                <button type="submit" name="submit"
                    class="w-full bg-primary text-white font-bold py-4 rounded-lg hover:bg-blue-600 transition shadow-lg transform hover:-translate-y-0.5">Submit
                    Request</button>
            </form>

            <p class="mt-8 text-center text-sm text-gray-500">
                Or email us at <a :href="'mailto:' + content.contact.supportEmail"
                    class="text-primary font-medium hover:underline" x-text="content.contact.supportEmail"></a>
            </p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white border-t py-12">
        <div class="max-w-6xl mx-auto px-6 flex flex-col items-center justify-center space-y-6">
            <a :href="content.footer.buyMeCoffeeLink" target="_blank" class="transform hover:scale-105 transition">
                <img :src="content.footer.buyMeCoffeeImage" alt="Buy Me A Coffee" class="h-12">
            </a>
            <p class="text-gray-400 text-sm" x-text="content.footer.copyright"></p>
        </div>
    </footer>

    <!-- Init Icons -->
    <script>
        document.addEventListener('alpine:initialized', () => {
            setTimeout(() => {
                lucide.createIcons();
            }, 100); // Wait for Alpine x-for to render
        });
    </script>
</body>

</html>
